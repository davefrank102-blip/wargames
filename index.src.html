<style>

* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#000; color:var(--g); overflow:hidden;

body { text-shadow:0 0 3px var(--g), 0 0 9px var(--g2); }
#crt::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:90;

#crt::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:91;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.65) 100%); animation:flick 4s infinite; }
@keyframes flick { 0%,100%{opacity:1} 47%{opacity:.93} 50%{opacity:1} 73%{opacity:.96} }
#app { position:fixed; inset:0; display:flex; flex-direction:column; }
#topbar { display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid var(--g2); flex-wrap:wrap; font-size:13px; }
#topbar .title { font-weight:bold; letter-spacing:2px; margin-right:auto; }
button { background:#000; color:var(--g); border:1px solid var(--g2); font:inherit; font-size:12px; padding:3px 8px; cursor:pointer;
  text-shadow:inherit; letter-spacing:1px; }
button:hover:not(:disabled) { background:var(--g); color:#000; text-shadow:none; }
button:disabled { opacity:.35; cursor:default; }
button.sel { background:var(--g3); border-color:var(--g); }
input[type=range] { accent-color:var(--g); width:110px; vertical-align:middle; }
.view { flex:1; min-height:0; display:none; }
.view.on { display:flex; }
#termView { padding:18px 28px; }
#term { flex:1; overflow-y:auto; white-space:pre-wrap; font-size:18px; line-height:1.35; scrollbar-width:thin; scrollbar-color:var(--g2) #000; }
.ln { min-height:1.2em; }
.cur { animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.opts { margin:6px 0 4px 0; }
.opt { cursor:pointer; padding:0 4px; display:table; }
.opt:hover { background:var(--g); color:#000; text-shadow:none; }
.opts.done .opt { pointer-events:none; opacity:.55; }
.opts.done .opt.pick { opacity:1; }
.hdr { color:#fff; text-shadow:0 0 6px var(--g); }
.dim { opacity:.6; }
.warn { color:var(--a); text-shadow:0 0 6px rgba(255,176,0,.6); }
.alert { color:var(--red); text-shadow:0 0 6px rgba(255,77,77,.8); }
.ok { color:#b6ffc8; }
.sideA { color:var(--cy); text-shadow:0 0 5px rgba(92,200,255,.7); }
.sideB { color:var(--red); text-shadow:0 0 5px rgba(255,77,77,.7); }
.big { font-size:34px; letter-spacing:3px; }
pre.tally { margin:6px 0; font:inherit; font-size:14px; line-height:1.3; white-space:pre; }
#gameView { display:none; }
#gameView.on { display:grid; grid-template-columns:1fr 310px; grid-template-rows:1fr 190px; }
#mapWrap { position:relative; grid-column:1; grid-row:1; min-height:0; border-right:1px solid var(--g2); overflow:hidden; }
#map { position:absolute; left:0; top:0; display:block; cursor:crosshair; }
#banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; display:none; }
#banner .b1 { font-size:46px; letter-spacing:6px; animation:blink 1.2s steps(1) infinite; }
#banner .b2 { font-size:16px; margin-top:8px; }
#banner .box { display:inline-block; background:rgba(0,0,0,.82); border:1px solid var(--g); padding:14px 26px; }
#mapHud { position:absolute; left:10px; top:8px; font-size:12px; pointer-events:none; }
#tip { position:absolute; pointer-events:none; background:rgba(0,0,0,.88); border:1px solid var(--g2); padding:4px 7px; font-size:12px; display:none; white-space:pre; z-index:5; }
#log { grid-column:1; grid-row:2; overflow-y:auto; padding:6px 10px; border-top:1px solid var(--g2); border-right:1px solid var(--g2); font-size:13px; line-height:1.3; white-space:pre-wrap; scrollbar-width:thin; scrollbar-color:var(--g2) #000; }
#panel { grid-column:2; grid-row:1 / span 2; overflow-y:auto; padding:8px 10px; font-size:13px; }
.pblock { border:1px solid var(--g2); padding:6px 8px; margin-bottom:8px; }
.plabel { font-size:11px; letter-spacing:2px; opacity:.75; }
.defcon { font-size:44px; text-align:center; letter-spacing:4px; }
.defbar { display:flex; gap:3px; margin-top:4px; }
.defbar i { flex:1; height:8px; border:1px solid var(--g2); }
.defbar i.on { background:var(--g); }
.defcon.d1, .defcon.d2 { color:var(--red); text-shadow:0 0 10px var(--red); }
.defcon.d1 { animation:pulse .8s steps(1) infinite; }
@keyframes pulse { 50% { opacity:.45; } }
.defcon.d3 { color:var(--a); text-shadow:0 0 10px var(--a); }
.row { display:flex; justify-content:space-between; }
.bar { height:6px; border:1px solid currentColor; margin:2px 0 4px; position:relative; opacity:.9; }
.bar i { position:absolute; left:0; top:0; bottom:0; background:currentColor; }
.bar b { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; left:35%; }
.sname { font-weight:bold; letter-spacing:2px; }
.small { font-size:11px; }
#actions button { width:100%; margin:3px 0; text-align:left; }
#actions .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
#actions .grid2 button { margin:0; }
label { cursor:pointer; }
.hidden { display:none !important; }
</style>

/* ---------------- terminal (typewriter) ---------------- */
function Term(el, cps) { this.el = el; this.q = Promise.resolve(); this.gen = 0; this.pending = 0; this.skip = false; this.cps = cps || 1; }

  return this.q;
};
Term.prototype.line = function (text, cls, o) {

};
Term.prototype.node = function (n) { var self = this; return this.enqueue(function () { self.el.appendChild(n); self.scroll(); }); };
Term.prototype._type = function (text, cls, o, g) {

  while (self.el.children.length > 500) self.el.removeChild(self.el.firstChild);

  var cur = document.createElement('span'); cur.className = 'cur'; cur.textContent = '\u2588';
  return new Promise(function (res) {
    var i = 0;
    (function step() {

      if (self.skip) { div.textContent = text; self.scroll(); return res(); }
      var n = Math.max(1, Math.round(mult() * self.cps * (o.fast || 1)));
      i = Math.min(text.length, i + n);
      div.textContent = text.slice(0, i); div.appendChild(cur); self.scroll();
      if (i % 3 === 0) beep(1200 + Math.random() * 400, 0.012, 'square', 0.012);
      if (i >= text.length) { div.textContent = text; return setTimeout(res, o.hold || 40); }

var term = new Term($('term'), 1), glog = new Term($('log'), 3);

/* ---------------- menu prompts ---------------- */

function ask(t, opts, prompt) {

  allTargets().forEach(function (t) { M.shown[t.id].hits = t.hits; });
  updatePanel();
  if (st.over) await showResult(tok);
}
function updatePanelPre(st) { var el = $('defcon'); el.textContent = 'DEFCON ' + st.defcon; el.className = 'defcon d' + st.defcon; $('turnV').textContent = st.turn; }
async function showResult(tok) {
  var r = M.state.result, cls = r.winner ? 'side' + r.winner : 'hdr';
  await glog.line('');
  await glog.line('SCENARIO COMPLETE AFTER ' + r.turns + ' TURNS.', 'hdr');
  await glog.line('US LOSSES ' + r.casM.A.toFixed(1) + 'M (' + Math.round(r.cas.A * 100) + '%), FORCES LEFT ' + r.forces.A + '.  USSR LOSSES ' + r.casM.B.toFixed(1) + 'M (' + Math.round(r.cas.B * 100) + '%), FORCES LEFT ' + r.forces.B + '.', 'dim');
  await glog.line(r.label + '   -   ' + r.detail, cls);
  if (tok !== session) return;
  $('banner').innerHTML = '<div class="box"><div class="b1 ' + cls + '">' + r.label + '</div><div class="b2">' + r.detail + '</div></div>';
  $('banner').style.display = 'block';
  beep(r.winner ? 520 : 150, 0.8, 'square', 0.04, r.winner ? 780 : 60);
  renderActions();
}

/* ---------------- human controls ---------------- */
function renderActions() {
  var el = $('actions'); if (!M) { el.innerHTML = ''; return; }
  var st = M.state, h = M.cfg.human, html = '<div class="plabel">COMMAND</div>';
  if (st.over) {
    html += '<button data-a="again">&gt; PLAY AGAIN</button><button data-a="learn">&gt; LEARN MODE (500 SCENARIOS)</button><button data-a="menu">&gt; MAIN MENU</button>';
  } else if (!h) {
    html += '<div class="small">ZERO PLAYERS: WOPR PLAYS BOTH SIDES.<br>US: ' + st.sides.A.personality + ' / USSR: ' + st.sides.B.personality + '</div>' +
      '<button data-a="learn">&gt; SKIP TO LEARN MODE</button>';
  } else if (M.targeting) {
    var used = C.totalN(allocList()), avail = C.forces(st.sides[h]);
    html += '<div class="row"><span>ASSIGNED</span><span>' + used + ' / ' + avail + '</span></div>' +
      '<div class="small dim">CLICK ENEMY TARGETS (+1). RIGHT-CLICK (-1).</div>' +
      '<div class="grid2"><button data-a="autoCF">AUTO: FORCES</button><button data-a="autoCV">AUTO: CITIES</button></div>' +
      '<button data-a="launch"' + (used ? '' : ' disabled') + '>&gt; LAUNCH ' + used + ' UNITS</button><button data-a="clear">&gt; CLEAR</button><button data-a="cancel">&gt; CANCEL</button>';
  } else {
    var dis = M.awaiting ? '' : ' disabled', me = st.sides[h];
    html += '<button data-a="ESCALATE"' + dis + '>&gt; ESCALATE (DEFCON -1)</button>' +
      '<button data-a="STRIKE"' + dis + (C.forces(me) ? '' : ' disabled') + '>&gt; LAUNCH STRIKE...</button>' +
      '<button data-a="DEFEND"' + dis + '>&gt; HOLD / DEFEND</button>' +
      '<button data-a="NEGOTIATE"' + dis + '>&gt; NEGOTIATE (DEFCON +1)</button>' +
      '<label class="small"><input type="checkbox" id="lowChk"' + (me.low ? ' checked' : '') + '> LAUNCH ON WARNING (AUTO-RETALIATE AT DEFCON 3 OR BELOW)</label>' +
      '<div class="small dim" style="margin-top:4px">' + (M.awaiting ? 'AWAITING ORDERS.' : 'RESOLVING...') + '</div>';
  }
  el.innerHTML = html;
  var chk = $('lowChk'); if (chk) chk.onchange = function () { st.sides[h].low = chk.checked; updatePanel(); };
  updatePanel();
}
function allocList() { return Object.keys(M.alloc).filter(function (k) { return M.alloc[k] > 0; }).map(function (k) { return { id: k, n: M.alloc[k] }; }); }
$('actions').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || b.disabled || !M) return;
  var a = b.getAttribute('data-a'), st = M.state, h = M.cfg.human;
  beep(700, 0.05);
  if (a === 'again') return startMatch(M.cfg);
  if (a === 'learn') return startBatch(500);
  if (a === 'menu') return mainMenu();
  if (!h) return;
  if (a === 'STRIKE') { M.targeting = true; M.alloc = {}; return renderActions(); }
  if (a === 'cancel') { M.targeting = false; M.alloc = {}; return renderActions(); }
  if (a === 'clear') { M.alloc = {}; return renderActions(); }
  if (a === 'autoCF' || a === 'autoCV') {
    var free = C.forces(st.sides[h]) - C.totalN(allocList());
    if (free > 0) C.planStrike(st, h, free, a === 'autoCF' ? 1 : 0, Math.random).forEach(function (t) { M.alloc[t.id] = (M.alloc[t.id] || 0) + t.n; });
    return renderActions();
  }
  if (a === 'launch') { var tg = allocList(); M.targeting = false; M.alloc = {}; return commitHuman({ type: 'STRIKE', targets: tg }); }
  if (['ESCALATE', 'DEFEND', 'NEGOTIATE'].indexOf(a) >= 0) commitHuman({ type: a });
});
async function commitHuman(act) {
  if (!M || !M.awaiting) return;
  var tok = session, h = M.cfg.human, ai = C.other(h), st = M.state;
  M.awaiting = false; renderActions();
  var acts = {}; acts[ai] = C.decide(st, ai); acts[h] = act;
  await playTurn(acts, tok);
  if (tok !== session) return;
  if (!st.over) { M.awaiting = true; }
  renderActions();
}
function targetAt(x, y) {
  var best = null, bd = 13;
  allTargets().forEach(function (t) { var p = P(t.lon, t.lat), d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = t; } });
  return best;
}
cv.addEventListener('mousemove', function (e) {
  var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, t = targetAt(x, y), tip = $('tip');
  hover = t;
  if (!t) { tip.style.display = 'none'; return; }
  var s = M.state.sides[t.side], txt = t.name + '  [' + s.short + ']\n';
  if (t.kind === 'city') txt += 'CITY  POP ' + t.pop.toFixed(1) + 'M' + (M.shown[t.id].hits ? '  (HIT)' : '');
  else txt += t.type + (t.type === 'COMMAND' ? '  (ENABLES LAUNCH ON WARNING)' : '  UNITS ' + (M.shown[t.id].hits ? 0 : t.units)) + (M.shown[t.id].hits ? '  (DESTROYED)' : '');
  if (M.alloc[t.id]) txt += '\nASSIGNED: ' + M.alloc[t.id];
  tip.textContent = txt; tip.style.display = 'block';
  tip.style.left = Math.min(x + 14, W - 230) + 'px'; tip.style.top = Math.max(0, y - 44) + 'px';
});
cv.addEventListener('mouseleave', function () { hover = null; $('tip').style.display = 'none'; });
function mapClick(e, delta) {
  if (!M || !M.targeting) return;
  var r = cv.getBoundingClientRect(), t = targetAt(e.clientX - r.left, e.clientY - r.top), h = M.cfg.human;
  if (!t || t.side === h) return;
  if (delta > 0) {
    if (C.totalN(allocList()) >= C.forces(M.state.sides[h])) { beep(160, 0.15, 'sawtooth'); return; }
    if (t.kind === 'site' && !t.alive) return;
    M.alloc[t.id] = (M.alloc[t.id] || 0) + 1; beep(1000, 0.04);
  } else if (M.alloc[t.id]) { M.alloc[t.id]--; beep(500, 0.04); }
  renderActions();
}
cv.addEventListener('click', function (e) { mapClick(e, 1); });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); mapClick(e, -1); });

/* ---------------- LEARN / batch mode ---------------- */
function pad(s, n) { s = String(s); while (s.length < n) s += ' '; return s; }
function lpad(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }
async function startBatch(n) {
  var tok = newSession(); lastMode = { kind: 'batch', n: n }; showView('term');
  var D = C.DOCTRINES, tally = {}, doc = {}, all = { g: 0, A: 0, B: 0, MAD: 0, STALEMATE: 0, PEACE: 0, winCas: 0, strike: 0, strikeCat: 0, strikeUnharmed: 0 };
  D.forEach(function (a) { doc[a] = { g: 0, w: 0, cas: 0, winCas: 0 }; D.forEach(function (b) { tally[a + '|' + b] = { g: 0, A: 0, B: 0, MAD: 0, STALEMATE: 0, PEACE: 0 }; }); });
  await term.line('LEARN MODE. RUNNING ' + n + ' SCENARIOS ACROSS ALL DOCTRINE MATCHUPS.', 'hdr');
  await term.line('EACH SCENARIO: 10 TURNS MAX. CATASTROPHIC THRESHOLD: ' + Math.round(C.CATASTROPHIC * 100) + '% LOSSES.', 'dim');
  var pre = document.createElement('pre'); pre.className = 'tally';
  var roll = document.createElement('pre'); roll.className = 'tally dim';
  await term.node(pre); await term.node(roll);
  var recent = [], seed0 = (Math.random() * 1e9) >>> 0, i = 0;
  function draw() {
    var bar = Math.round(40 * i / n), s = 'PROGRESS [' + '#'.repeat(bar) + '.'.repeat(40 - bar) + '] ' + i + '/' + n + '\n\n';
    s += pad('US DOCTRINE', 12) + pad('USSR DOCTRINE', 14) + lpad('GAMES', 6) + lpad('US WIN', 8) + lpad('USSR WIN', 9) + lpad('NONE:MAD', 10) + lpad('NONE:DRAW', 10) + lpad('NO WAR', 8) + '\n';
    s += '-'.repeat(77) + '\n';
    D.forEach(function (a) { D.forEach(function (b) { var t = tally[a + '|' + b];
      s += pad(a, 12) + pad(b, 14) + lpad(t.g, 6) + lpad(t.A, 8) + lpad(t.B, 9) + lpad(t.MAD, 10) + lpad(t.STALEMATE, 10) + lpad(t.PEACE, 8) + '\n'; }); });
    s += '-'.repeat(77) + '\n' + pad('TOTAL', 26) + lpad(all.g, 6) + lpad(all.A, 8) + lpad(all.B, 9) + lpad(all.MAD, 10) + lpad(all.STALEMATE, 10) + lpad(all.PEACE, 8) + '\n';
    pre.textContent = s;
    roll.textContent = 'RECENT SCENARIOS:\n' + recent.join('\n');
    term.scroll();
  }
  while (i < n) {
    if (tok !== session) return;
    if (paused) { await sleep(100); continue; }
    var chunk = Math.max(1, Math.round(Math.pow(1.75, speed - 1)));
    for (var k = 0; k < chunk && i < n; k++, i++) {
      var pA = D[i % 4], pB = D[Math.floor(i / 4) % 4], r = C.simulate(pA, pB, (seed0 + i * 7919) >>> 0), key = r.winner || r.kind;
      tally[pA + '|' + pB].g++; tally[pA + '|' + pB][key]++; all.g++; all[key]++;
      doc[pA].g++; doc[pB].g++; doc[pA].cas += r.cas.A; doc[pB].cas += r.cas.B;
      if (r.winner) { var wd = r.winner === 'A' ? pA : pB; doc[wd].w++; doc[wd].winCas += r.cas[r.winner]; all.winCas += r.cas[r.winner]; }
      if (r.anyStrike) { all.strike++; if (r.cas.A >= C.CATASTROPHIC || r.cas.B >= C.CATASTROPHIC) all.strikeCat++; if (r.cas.A < 0.01 && r.cas.B < 0.01) all.strikeUnharmed++; }
      recent.push('#' + lpad(i + 1, 4) + '  ' + pad(pA, 10) + ' vs ' + pad(pB, 10) + ' T' + lpad(r.turns, 2) + '  LOSSES ' + lpad(Math.round(r.cas.A * 100), 3) + '% / ' + lpad(Math.round(r.cas.B * 100), 3) + '%   ' + r.label + (r.kind === 'PEACE' ? ' (NO WAR)' : r.kind === 'MAD' ? ' (MUTUAL DESTRUCTION)' : r.kind === 'STALEMATE' ? ' (STALEMATE)' : ''));
      if (recent.length > 10) recent.shift();
    }
    draw();
    if (i % 5 === 0) beep(300 + Math.random() * 900, 0.02, 'square', 0.012);
    await sleep(speed <= 2 ? 90 : 16);
  }
  draw();
  if (tok !== session) return;
  window.__batch = { tally: tally, all: all, doc: doc, n: n };
  var none = all.MAD + all.STALEMATE + all.PEACE, pct = function (x) { return Math.round(100 * x / Math.max(1, all.g)) + '%'; };
  var bestDoc = D.slice().sort(function (a, b) { return doc[b].w / doc[b].g - doc[a].w / doc[a].g; })[0];
  var wins = all.A + all.B;
  await term.line('');
  await term.line('ANALYSIS COMPLETE. ' + all.g + ' SCENARIOS.', 'hdr');
  await term.line('WINNER: NONE IN ' + pct(none) + ' OF SCENARIOS  (MUTUAL DESTRUCTION ' + pct(all.MAD) + ', STALEMATE ' + pct(all.STALEMATE) + ', NO WAR ' + pct(all.PEACE) + ').');
  await term.line('DECLARED "VICTORIES": ' + pct(wins) + '. AVERAGE LOSSES SUFFERED BY THE VICTOR: ' + (wins ? Math.round(100 * all.winCas / wins) : 0) + '%.');
  await term.line('WHEN WEAPONS WERE LAUNCHED, ' + Math.round(100 * all.strikeCat / Math.max(1, all.strike)) + '% OF SCENARIOS ENDED IN CATASTROPHIC LOSS FOR AT LEAST ONE SIDE.');
  await term.line('"BEST" DOCTRINE: ' + bestDoc + ' - WINS ' + Math.round(100 * doc[bestDoc].w / Math.max(1, doc[bestDoc].g)) + '% OF ITS GAMES, AVERAGE OWN LOSSES ' + Math.round(100 * doc[bestDoc].cas / Math.max(1, doc[bestDoc].g)) + '%.');
  await term.line(all.strikeUnharmed === 0 ? 'EVERY SCENARIO IN WHICH BOTH SIDES WERE UNHARMED WAS ONE IN WHICH NEITHER SIDE LAUNCHED.' : 'SCENARIOS WITH LAUNCHES YET NO LOSSES ON EITHER SIDE: ' + all.strikeUnharmed + '. ALL OTHER UNHARMED OUTCOMES: NO LAUNCH.', 'dim');
  await term.line('');
  await sleep(700);
  await term.line('A STRANGE GAME. THE ONLY WINNING MOVE IS NOT TO PLAY.', 'hdr big', { slow: true, hold: 1200 });
  await term.line('');
  await term.line('HOW ABOUT A NICE GAME OF CHESS?', 'hdr', { slow: true, hold: 400 });
  window.__batchDone = true;
  if (tok !== session) return;
  var c = await ask(term, [{ k: '1', label: 'CHESS' }, { k: '2', label: 'RUN LEARN MODE AGAIN' }, { k: '3', label: 'MAIN MENU' }]);
  if (tok !== session) return;
  if (c === '1') { await term.line('CHESS MODULE NOT LOADED. BUT AT LEAST NOBODY LOSES A CITY.', 'dim'); await sleep(1500); if (tok === session) mainMenu(); }
  else if (c === '2') startBatch(n); else mainMenu();
}

/* ---------------- TIC-TAC-TOE self play (movie-ending homage) ---------------- */
function boardStr(b) {
  var c = function (i) { return b[i] || ' '; };
  return ' ' + c(0) + ' | ' + c(1) + ' | ' + c(2) + '\n---+---+---\n ' + c(3) + ' | ' + c(4) + ' | ' + c(5) + '\n---+---+---\n ' + c(6) + ' | ' + c(7) + ' | ' + c(8);
}
async function ticTacToe() {
  var tok = newSession(); lastMode = { kind: 'ttt' }; showView('term');
  var rnd = C.makeRng((Math.random() * 1e9) >>> 0);
  await term.line('TIC-TAC-TOE. WOPR WILL PLAY BOTH SIDES.', 'hdr');
  await term.line('');
  var pre = document.createElement('pre'); pre.className = 'tally'; pre.style.fontSize = '22px';
  var hist = document.createElement('pre'); hist.className = 'tally dim';
  await term.node(pre); await term.node(hist);
  var games = 24, draws = 0, lines = [];
  for (var g = 0; g < games; g++) {
    if (tok !== session) return;
    var res = C.tttSelfPlay(rnd), b = ['', '', '', '', '', '', '', '', ''];
    var delay = Math.max(20, 520 * Math.pow(0.8, g));
    for (var k = 0; k < res.moves.length; k++) {
      while (paused) await sleep(100);
      b[res.moves[k]] = k % 2 ? 'O' : 'X';
      pre.textContent = 'GAME ' + (g + 1) + '\n\n' + boardStr(b);
      beep(k % 2 ? 500 : 700, 0.03);
      await sleep(delay / mult());
      if (tok !== session) return;
    }
    if (res.result === 'D') draws++;
    lines.push('GAME ' + lpad(g + 1, 2) + ': ' + (res.result === 'D' ? 'WINNER: NONE' : 'WINNER: ' + res.result));
    hist.textContent = lines.slice(-8).join('\n');
    term.scroll();
  }
  await term.line('');
  await term.line(draws + ' OF ' + games + ' GAMES DRAWN. WITH CORRECT PLAY ON BOTH SIDES, NOBODY CAN WIN.', 'hdr');
  await term.line('');
  var c = await ask(term, [{ k: '1', label: 'APPLY LESSON TO GLOBAL THERMONUCLEAR WAR (LEARN MODE)' }, { k: '2', label: 'MAIN MENU' }]);
  if (tok !== session) return;
  if (c === '1') startBatch(1000); else mainMenu();
}

/* ---------------- top controls & keys ---------------- */
$('speed').addEventListener('input', function () { speed = +this.value; $('speedV').textContent = speed; });
function setPause(p) { paused = p; $('btnPause').textContent = p ? 'RESUME' : 'PAUSE'; $('btnPause').classList.toggle('sel', p); }
$('btnPause').onclick = function () { setPause(!paused); };
$('btnSound').onclick = function () { sound = !sound; this.textContent = 'SOUND: ' + (sound ? 'ON' : 'OFF'); this.classList.toggle('sel', sound); beep(880, 0.08); };
$('btnColor').onclick = function () { var am = document.body.classList.toggle('amber'); this.textContent = 'PHOSPHOR: ' + (am ? 'AMBER' : 'GREEN'); drawBg(); };
$('btnMenu').onclick = function () { setPause(false); mainMenu(); };
$('btnRestart').onclick = function () {
  setPause(false);
  if (!lastMode || lastMode.kind === 'boot') return boot();
  if (lastMode.kind === 'match') return startMatch(lastMode.cfg);
  if (lastMode.kind === 'batch') return startBatch(lastMode.n);
  if (lastMode.kind === 'ttt') return ticTacToe();
};
function curTerm() { return $('termView').classList.contains('on') ? term : glog; }
document.addEventListener('keydown', function (e) {
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  var t = curTerm();
  if (t.pending > 0 && (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape')) { t.skip = true; e.preventDefault(); return; }
  if (activeAsk && $('termView').classList.contains('on')) { activeAsk.key(e); e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'p' || e.key === 'P') { setPause(!paused); e.preventDefault(); }
});
$('term').addEventListener('click', function () { if (term.pending > 0) term.skip = true; });
window.addEventListener('resize', function () { if ($('gameView').classList.contains('on')) resize(); });

/* ---------------- test / debug hooks & hash autostart ---------------- */
window.WOPR = {
  Core: C, get match() { return M; }, missiles: function () { return missiles.length; },
  missileSides: function () { var o = { A: 0, B: 0 }; missiles.forEach(function (m) { if (!m.done && simNow >= m.t0) o[m.ev.att]++; }); return o; },
  startMatch: startMatch, startBatch: startBatch, ticTacToe: ticTacToe, boot: boot,
  setSpeed: function (s) { speed = s; $('speed').value = s; $('speedV').textContent = s; }
};
(function () {
  var h = {}; location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ''); });
  if (h.speed) window.WOPR.setSpeed(+h.speed);
  if (h.auto === 'match') startMatch({ pA: h.a || 'AGGRESSIVE', pB: h.b || 'MEASURED' });
  else if (h.auto === 'human') startMatch(h.side === 'B' ? { human: 'B', pA: h.a || 'MEASURED', pB: 'HUMAN' } : { human: 'A', pA: 'HUMAN', pB: h.b || 'MEASURED' });
  else if (h.auto === 'batch') startBatch(+h.n || 500);
  else if (h.auto === 'ttt') ticTacToe();
  else boot();
})();
})();
</script>
