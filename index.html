<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W.O.P.R. // GLOBAL THERMONUCLEAR WAR (a fictional simulation)</title>
<style>
:root { --g:#39ff6a; --g2:rgba(57,255,106,.55); --g3:rgba(57,255,106,.14); --a:#ffb000; --red:#ff4d4d; --cy:#5cc8ff; }
body.amber { --g:#ffb000; --g2:rgba(255,176,0,.55); --g3:rgba(255,176,0,.14); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#000; color:var(--g); overflow:hidden;
  font-family:"Lucida Console","Courier New",Consolas,monospace; font-size:15px; }
body { text-shadow:0 0 3px var(--g), 0 0 9px var(--g2); }
#crt::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:90;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px, rgba(0,0,0,0) 4px); }
#crt::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:91;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.65) 100%); animation:flick 4s infinite; }
@keyframes flick { 0%,100%{opacity:1} 47%{opacity:.93} 50%{opacity:1} 73%{opacity:.96} }
#app { position:fixed; inset:0; display:flex; flex-direction:column; }
#topbar { display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid var(--g2); flex-wrap:wrap; font-size:13px; }
#topbar .title { font-weight:bold; letter-spacing:2px; margin-right:auto; }
button { background:#000; color:var(--g); border:1px solid var(--g2); font:inherit; font-size:12px; padding:3px 8px; cursor:pointer;
  text-shadow:inherit; letter-spacing:1px; }
button:hover:not(:disabled) { background:var(--g); color:#000; text-shadow:none; }
button:disabled { opacity:.35; cursor:default; }
button.sel { background:var(--g3); border-color:var(--g); }
input[type=range] { accent-color:var(--g); width:110px; vertical-align:middle; }
.view { flex:1; min-height:0; display:none; }
.view.on { display:flex; }
#termView { padding:18px 28px; }
#term { flex:1; overflow-y:auto; white-space:pre-wrap; font-size:18px; line-height:1.35; scrollbar-width:thin; scrollbar-color:var(--g2) #000; }
.ln { min-height:1.2em; }
.cur { animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.opts { margin:6px 0 4px 0; }
.opt { cursor:pointer; padding:0 4px; display:table; }
.opt:hover { background:var(--g); color:#000; text-shadow:none; }
.opts.done .opt { pointer-events:none; opacity:.55; }
.opts.done .opt.pick { opacity:1; }
.hdr { color:#fff; text-shadow:0 0 6px var(--g); }
.dim { opacity:.6; }
.warn { color:var(--a); text-shadow:0 0 6px rgba(255,176,0,.6); }
.alert { color:var(--red); text-shadow:0 0 6px rgba(255,77,77,.8); }
.ok { color:#b6ffc8; }
.sideA { color:var(--cy); text-shadow:0 0 5px rgba(92,200,255,.7); }
.sideB { color:var(--red); text-shadow:0 0 5px rgba(255,77,77,.7); }
.big { font-size:34px; letter-spacing:3px; }
pre.tally { margin:6px 0; font:inherit; font-size:14px; line-height:1.3; white-space:pre; }
#gameView { display:none; }
#gameView.on { display:grid; grid-template-columns:1fr 310px; grid-template-rows:1fr 190px; }
#mapWrap { position:relative; grid-column:1; grid-row:1; min-height:0; border-right:1px solid var(--g2); overflow:hidden; }
#map { position:absolute; left:0; top:0; display:block; cursor:crosshair; }
#banner { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; display:none; }
#banner .b1 { font-size:46px; letter-spacing:6px; animation:blink 1.2s steps(1) infinite; }
#banner .b2 { font-size:16px; margin-top:8px; }
#banner .box { display:inline-block; background:rgba(0,0,0,.82); border:1px solid var(--g); padding:14px 26px; }
#mapHud { position:absolute; left:10px; top:8px; font-size:12px; pointer-events:none; }
#tip { position:absolute; pointer-events:none; background:rgba(0,0,0,.88); border:1px solid var(--g2); padding:4px 7px; font-size:12px; display:none; white-space:pre; z-index:5; }
#log { grid-column:1; grid-row:2; overflow-y:auto; padding:6px 10px; border-top:1px solid var(--g2); border-right:1px solid var(--g2); font-size:13px; line-height:1.3; white-space:pre-wrap; scrollbar-width:thin; scrollbar-color:var(--g2) #000; }
#panel { grid-column:2; grid-row:1 / span 2; overflow-y:auto; padding:8px 10px; font-size:13px; }
.pblock { border:1px solid var(--g2); padding:6px 8px; margin-bottom:8px; }
.plabel { font-size:11px; letter-spacing:2px; opacity:.75; }
.defcon { font-size:44px; text-align:center; letter-spacing:4px; }
.defbar { display:flex; gap:3px; margin-top:4px; }
.defbar i { flex:1; height:8px; border:1px solid var(--g2); }
.defbar i.on { background:var(--g); }
.defcon.d1, .defcon.d2 { color:var(--red); text-shadow:0 0 10px var(--red); }
.defcon.d1 { animation:pulse .8s steps(1) infinite; }
@keyframes pulse { 50% { opacity:.45; } }
.defcon.d3 { color:var(--a); text-shadow:0 0 10px var(--a); }
.row { display:flex; justify-content:space-between; }
.bar { height:6px; border:1px solid currentColor; margin:2px 0 4px; position:relative; opacity:.9; }
.bar i { position:absolute; left:0; top:0; bottom:0; background:currentColor; }
.bar b { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; left:35%; }
.sname { font-weight:bold; letter-spacing:2px; }
.small { font-size:11px; }
#actions button { width:100%; margin:3px 0; text-align:left; }
#actions .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
#actions .grid2 button { margin:0; }
label { cursor:pointer; }
.hidden { display:none !important; }
/* LEARN mode big board */
#learnHud { position:absolute; inset:0; pointer-events:none; display:none; }
#gameView.learn #learnHud { display:block; }
#gameView.learn #mapHud, #gameView.learn #banner { display:none !important; }
#lhCount { position:absolute; left:12px; top:8px; font-size:12px; letter-spacing:2px; }
#lhNum { display:block; font-size:44px; letter-spacing:5px; color:#fff; text-shadow:0 0 8px var(--g), 0 0 22px var(--g2); line-height:1.05; }
#lhTitle { position:absolute; left:0; right:0; bottom:5%; text-align:center; }
#lhTitle .box { display:inline-block; background:rgba(0,0,0,.72); border:1px solid var(--g2); padding:8px 22px; min-width:46%; }
#lhT1 { font-size:28px; letter-spacing:5px; color:#fff; text-shadow:0 0 8px var(--g); }
#lhT2 { font-size:15px; letter-spacing:4px; margin-top:2px; }
#lhT3 { font-size:11px; letter-spacing:1px; opacity:.7; margin-top:2px; }
#lhWin { font-size:24px; letter-spacing:5px; margin-top:6px; min-height:1.2em; }
#lhWin.on { animation:blink .3s steps(1) infinite; }
.flickr #lhT1, .flickr #lhT2 { animation:flk .09s steps(2) infinite; }
@keyframes flk { 50% { opacity:.5; } }
.defcon.flickd { animation:flk .14s steps(2) infinite; }
#flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4; }
#flash.go { animation:flashA 1.2s ease-out forwards; }
@keyframes flashA { 0% { opacity:0; } 6% { opacity:.95; } 20% { opacity:.5; } 100% { opacity:0; } }
#learnPanel { display:none; }
#gameView.learn #learnPanel { display:block; }
#gameView.learn #sideBlocks, #gameView.learn #actions { display:none; }
.lpcount { font-size:34px; letter-spacing:3px; color:#fff; text-align:center; }
#learnPanel .bar b { display:none; }
#learnPanel pre, #log pre.recent { margin:0; font:inherit; white-space:pre; }
#lpMat { font-size:10.5px; line-height:1.25; letter-spacing:0; }
#btnSkip { width:100%; margin-top:6px; }
#log pre.recent { font-size:12px; line-height:1.3; }
@media (max-width:700px) {
  html,body { font-size:13px; }
  #topbar { gap:5px; padding:4px 6px; font-size:11px; }
  #topbar .title { width:100%; font-size:11px; letter-spacing:1px; }
  input[type=range] { width:70px; }
  button { font-size:11px; padding:2px 5px; letter-spacing:0; }
  #termView { padding:10px 10px; }
  #term { font-size:14px; }
  .big { font-size:21px; letter-spacing:1px; }
  pre.tally { font-size:12px; white-space:pre; overflow-x:hidden; }
  #gameView.on { display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  #mapWrap { flex:0 0 auto; height:60vw; min-height:200px; border-right:0; border-bottom:1px solid var(--g2); }
  #panel { order:2; overflow:visible; padding:6px; font-size:12px; flex:0 0 auto; }
  #sideBlocks { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #sideBlocks .pblock { margin-bottom:6px; padding:4px 5px; font-size:10.5px; }
  .defcon { font-size:30px; }
  #log { order:3; flex:0 0 auto; min-height:170px; max-height:320px; border-right:0; font-size:12px; }
  #log pre.recent { font-size:10.5px; }
  #banner .b1 { font-size:22px; letter-spacing:2px; }
  #banner .b2 { font-size:12px; }
  #banner .box { padding:8px 10px; }
  #lhNum { font-size:24px; letter-spacing:2px; }
  #lhCount { font-size:9px; left:6px; top:4px; }
  #lhTitle { bottom:2%; }
  #lhTitle .box { padding:3px 8px; max-width:96%; }
  #lhT1 { font-size:14px; letter-spacing:2px; }
  #lhT2 { font-size:10px; letter-spacing:1px; }
  #lhT3 { display:none; }
  #lhWin { font-size:13px; letter-spacing:2px; margin-top:2px; }
  #lpMat { font-size:11px; }
}
</style>
</head>
<body>
<div id="crt"></div>
<div id="app">
  <div id="topbar">
    <span class="title">W.O.P.R. // STRATEGIC SIMULATION TERMINAL</span>
    <span>SPEED <input type="range" id="speed" min="1" max="10" value="4"> <span id="speedV">4</span></span>
    <button id="btnPause" title="Space">PAUSE</button>
    <button id="btnRestart">RESTART</button>
    <button id="btnSound">SOUND: OFF</button>
    <button id="btnColor">PHOSPHOR: GREEN</button>
    <button id="btnMenu">MENU</button>
  </div>
  <section id="termView" class="view on"><div id="term"></div></section>
  <section id="gameView" class="view">
    <div id="mapWrap"><canvas id="map"></canvas><div id="mapHud"></div><div id="banner"></div><div id="tip"></div>
      <div id="learnHud"><div id="lhCount"><span id="lhNum"></span><span id="lhOf"></span></div>
        <div id="lhTitle"><div class="box"><div id="lhT1"></div><div id="lhT2"></div><div id="lhT3"></div><div id="lhWin"></div></div></div></div>
      <div id="flash"></div></div>
    <div id="log"></div>
    <aside id="panel">
      <div class="pblock"><div class="plabel">DEFENSE CONDITION</div><div id="defcon" class="defcon d5">DEFCON 5</div>
        <div class="defbar" id="defbar"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="row small" style="margin-top:6px"><span>TURN <span id="turnV">0</span>/<span id="maxTurnV">10</span></span><span id="modeV"></span></div></div>
      <div id="sideBlocks"></div>
      <div class="pblock" id="actions"></div>
      <div id="learnPanel">
        <div class="pblock"><div class="plabel">LEARN MODE // SCENARIOS RUN</div><div id="lpCount" class="lpcount">0</div>
          <div class="row small"><span id="lpOf"></span><span id="lpRate"></span></div><div class="bar"><i id="lpProg"></i></div>
          <button id="btnSkip" title="Jump straight to the results">&gt;&gt; SKIP TO RESULTS</button></div>
        <div class="pblock"><div class="plabel">RESULTS TALLY</div><div id="lpTot"></div></div>
        <div class="pblock"><div class="plabel">BY DOCTRINE MATCHUP</div><pre id="lpMat"></pre></div>
      </div>
    </aside>
  </section>
</div>
<script id="core">
/* ===== WOPR CORE: pure game logic (no DOM). Exposed as WOPRCore. ===== */
(function (root) {
  'use strict';
  var CATASTROPHIC = 0.35;           // fraction of target-city population lost = catastrophic
  var DOCTRINES = ['AGGRESSIVE', 'MEASURED', 'DEFENSIVE', 'RANDOM'];
  var DOCTRINE_INFO = {
    AGGRESSIVE: { desc: 'FIRST STRIKE. ESCALATES EARLY AND HITS FORCES BEFORE THEY LAUNCH.', lowFrac: 1.0, lowCF: 0.5 },
    MEASURED:   { desc: 'PROPORTIONAL RESPONSE. MATCHES ESCALATION, ANSWERS IN KIND.', lowFrac: 0.5, lowCF: 0.5 },
    DEFENSIVE:  { desc: 'DETERRENCE. FAVORS INTERCEPTORS AND TALKS; RETALIATES WHEN HURT.', lowFrac: 0.3, lowCF: 0.15 },
    RANDOM:     { desc: 'UNPREDICTABLE. ACTIONS DRAWN AT RANDOM.', lowFrac: 0.5, lowCF: 0.5 },
    HUMAN:      { desc: 'HUMAN COMMANDER.', lowFrac: 0.5, lowCF: 0.5 }
  };
  // Abstract game data. Populations are rounded, approximate "game points" (millions).
  // Site unit counts are arbitrary game values, not real force data.
  var SIDE_DATA = {
    A: {
      name: 'UNITED STATES', short: 'US', interceptors: 20, subs: 8,
      subPatrol: [[-45, 42], [-150, 38], [-30, 58], [-60, 30]],
      cities: [
        ['NEW YORK', -74.0, 40.7, 16.0], ['LOS ANGELES', -118.2, 34.0, 11.0], ['CHICAGO', -87.6, 41.9, 7.9],
        ['PHILADELPHIA', -75.2, 39.9, 5.6], ['SAN FRANCISCO', -122.4, 37.8, 5.4], ['DETROIT', -83.0, 42.3, 4.6],
        ['BOSTON', -71.1, 42.4, 4.0], ['WASHINGTON', -77.0, 38.9, 3.4], ['HOUSTON', -95.4, 29.8, 3.1],
        ['DALLAS', -96.8, 32.8, 3.0], ['ATLANTA', -84.4, 33.7, 2.1], ['SEATTLE', -122.3, 47.6, 2.1]
      ],
      sites: [
        ['SILO FIELD ALPHA', 'SILO', -109.0, 47.5, 8], ['SILO FIELD BRAVO', 'SILO', -101.5, 47.9, 8],
        ['SILO FIELD CHARLIE', 'SILO', -104.3, 42.2, 6], ['BOMBER BASE', 'AIRBASE', -97.0, 36.5, 5],
        ['SUB PEN (PACIFIC)', 'SUBBASE', -123.2, 44.5, 3], ['NORAD COMMAND', 'COMMAND', -104.8, 38.7, 0]
      ]
    },
    B: {
      name: 'SOVIET UNION', short: 'USSR', interceptors: 22, subs: 7,
      subPatrol: [[-15, 66], [165, 48], [5, 74], [-35, 50]],
      cities: [
        ['MOSCOW', 37.6, 55.75, 8.5], ['LENINGRAD', 30.3, 59.9, 4.8], ['KIEV', 30.5, 50.45, 2.4],
        ['TASHKENT', 69.3, 41.3, 2.0], ['BAKU', 49.9, 40.4, 1.7], ['KHARKOV', 36.2, 50.0, 1.5],
        ['MINSK', 27.6, 53.9, 1.5], ['GORKY', 44.0, 56.3, 1.4], ['NOVOSIBIRSK', 82.9, 55.0, 1.4],
        ['SVERDLOVSK', 60.6, 56.8, 1.3], ['KUYBYSHEV', 50.1, 53.2, 1.3], ['VLADIVOSTOK', 131.9, 43.1, 0.6]
      ],
      sites: [
        ['SILO FIELD URAL', 'SILO', 57.5, 51.8, 9], ['SILO FIELD OMSK', 'SILO', 73.4, 54.0, 8],
        ['SILO FIELD YENISEI', 'SILO', 92.0, 56.5, 6], ['BOMBER BASE', 'AIRBASE', 46.2, 50.2, 4],
        ['SUB PEN (NORTH)', 'SUBBASE', 33.2, 68.9, 3], ['COMMAND BUNKER', 'COMMAND', 40.5, 58.2, 0]
      ]
    }
  };

  function makeRng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function other(id) { return id === 'A' ? 'B' : 'A'; }
  function forces(s) {
    var n = s.subUnits;
    for (var i = 0; i < s.sites.length; i++) if (s.sites[i].alive) n += s.sites[i].units;
    return n;
  }
  function casFrac(s) { return s.casualties / s.totalPop; }

  function mkSide(id, personality, rnd, low) {
    var d = SIDE_DATA[id];
    var s = {
      id: id, name: d.name, short: d.short, personality: personality,
      cities: [], sites: [], subUnits: d.subs, subPatrol: d.subPatrol,
      interceptors: d.interceptors, maxInterceptors: d.interceptors,
      casualties: 0, totalPop: 0, commandAlive: true, receivedLast: 0, lowFiredLast: false,
      launched: 0, unitsLost: 0, intercepts: 0
    };
    d.cities.forEach(function (c, i) {
      s.cities.push({ id: id + 'C' + i, side: id, kind: 'city', name: c[0], lon: c[1], lat: c[2], pop: c[3], popLeft: c[3], hits: 0 });
      s.totalPop += c[3];
    });
    d.sites.forEach(function (c, i) {
      s.sites.push({ id: id + 'S' + i, side: id, kind: 'site', name: c[0], type: c[1], lon: c[2], lat: c[3], units: c[4], alive: true, hits: 0 });
    });
    s.initialForces = forces(s);
    s.low = (low !== undefined) ? !!low : (personality === 'RANDOM' ? rnd() < 0.6 : true);
    return s;
  }

  function newGame(o) {
    o = o || {};
    var seed = (o.seed !== undefined) ? o.seed : ((Math.random() * 4294967295) >>> 0);
    var rnd = makeRng(seed);
    var st = {
      seed: seed, rnd: rnd, turn: 0, maxTurns: o.maxTurns || 10, defcon: 5,
      over: false, result: null, anyStrike: false, falseAlarms: o.falseAlarms !== false,
      lastActions: { A: null, B: null }, history: []
    };
    st.sides = { A: mkSide('A', o.pA || 'MEASURED', rnd, o.lowA), B: mkSide('B', o.pB || 'MEASURED', rnd, o.lowB) };
    return st;
  }

  function findTarget(side, id) {
    var i;
    for (i = 0; i < side.cities.length; i++) if (side.cities[i].id === id) return side.cities[i];
    for (i = 0; i < side.sites.length; i++) if (side.sites[i].id === id) return side.sites[i];
    return null;
  }
  function getTarget(state, id) { return findTarget(state.sides[id.charAt(0)], id); }
  function isCityId(id) { return id.charAt(1) === 'C'; }

  /* Remove strike units from a side; returns launch origins [lon,lat]. Priority sites launch first (use-or-lose). */
  function drawUnits(side, n, rnd, priority) {
    var out = [];
    function takeFrom(st) { while (st.alive && st.units > 0 && out.length < n) { st.units--; out.push([st.lon, st.lat]); } }
    if (priority) side.sites.forEach(function (st) { if (priority[st.id]) takeFrom(st); });
    ['SILO', 'AIRBASE', 'SUBBASE'].forEach(function (t) { side.sites.forEach(function (st) { if (st.type === t) takeFrom(st); }); });
    while (side.subUnits > 0 && out.length < n) {
      side.subUnits--;
      var p = side.subPatrol[Math.floor(rnd() * side.subPatrol.length)];
      out.push([p[0] + (rnd() - 0.5) * 10, p[1] + (rnd() - 0.5) * 6]);
    }
    side.launched += out.length;
    return out;
  }

  /* Build a target allocation: cf = fraction counterforce (military sites), rest countervalue (cities). */
  function planStrike(state, attId, n, cf, rnd) {
    var def = state.sides[other(attId)], alloc = {};
    var nCF = Math.round(n * cf), nCV = n - nCF;
    var sites = def.sites.filter(function (s) { return s.alive && (s.units > 0 || s.type === 'COMMAND'); })
      .map(function (s) { return { s: s, v: s.units + (s.type === 'COMMAND' ? 6 : 0) + rnd() * 2 }; })
      .sort(function (a, b) { return b.v - a.v; }).map(function (x) { return x.s; });
    var cities = def.cities.filter(function (c) { return c.popLeft > 0.05; })
      .map(function (c) { return { c: c, v: c.popLeft * (0.8 + rnd() * 0.4) }; })
      .sort(function (a, b) { return b.v - a.v; }).map(function (x) { return x.c; });
    if (!sites.length) { nCV += nCF; nCF = 0; }
    if (!cities.length) { nCF += nCV; nCV = 0; }
    var i = 0;
    while (nCF > 0 && sites.length) { var st = sites[i % sites.length], k = Math.min(2, nCF); alloc[st.id] = (alloc[st.id] || 0) + k; nCF -= k; i++; }
    i = 0;
    while (nCV > 0 && cities.length) { var c = cities[i % cities.length]; alloc[c.id] = (alloc[c.id] || 0) + 1; nCV--; i++; }
    return Object.keys(alloc).map(function (k) { return { id: k, n: alloc[k] }; });
  }

  /* AI decision for side `id` according to its personality. */
  function decide(state, id) {
    var me = state.sides[id], r = state.rnd, d = state.defcon, f = forces(me);
    var opLast = state.lastActions[other(id)], hit = me.receivedLast;
    var ESC = { type: 'ESCALATE' }, DEF = { type: 'DEFEND' }, NEG = { type: 'NEGOTIATE' };
    function S(n, cf) { n = Math.max(1, Math.min(f, Math.round(n))); return { type: 'STRIKE', targets: planStrike(state, id, n, cf, r) }; }
    if (f <= 0) return d < 5 ? NEG : DEF;
    switch (me.personality) {
      case 'AGGRESSIVE':
        if (state.anyStrike) return r() < 0.85 ? S(f * (0.45 + 0.35 * r()), 0.35) : DEF;
        if (d <= 3 || (state.turn >= 1 && r() < 0.18)) return S(f * (0.65 + 0.15 * r()), 0.85);
        return r() < 0.85 ? ESC : DEF;
      case 'MEASURED':
        if (hit > 0 && !me.lowFiredLast) return S(hit * (0.9 + 0.4 * r()), 0.5);
